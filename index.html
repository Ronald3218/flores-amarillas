<!DOCTYPE html>
<html lang="es">

    >

            </p>

            </button>

        </div>

    </section>



    <!-- =========================
         PANTALLA DEL REGALO
    ========================== -->

    <section
        class="pantalla regalo oculto"
        id="regalo"
    >


        <!-- PÉTALOS CAYENDO -->

        <div class="petalos-cayendo">

            <span></span>

        <!-- BRILLOS DEL FONDO -->

      <div class="luces-fondo">
         <span></span>
         <span></span>
          <span></span>
         <span></span>
         <span></span>
         <span></span>
    </div>



        <!-- CONTENIDO -->

        <div class="contenido-regalo">

            <h2>
                Felíz 21 de septiembre 💛
            </h2>

            <p class="mensaje">
                Quería decirte que eres una persona increíble y única. 
                Espero que nuestra relación dure por siempre. 
                Ojalá este pequeño regalo pueda reflejar lo mucho que te aprecio.
            </p>



            <!-- RAMO -->

            <div class="ramo">

                <div class="resplandor-ramo"></div>

                <img
                    src="ramo-flores.png"
                    alt="Ramo de flores amarillas"
                    class="imagen-ramo"
                >

            <p class="texto-final">
                Te quiero, Juaneyris 🌻
            </p>
